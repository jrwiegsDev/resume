name: Build resume

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3

      - name: Render the PDF
        run: uv run rendercv render Joe_Wiegert_CV.yaml --dont-generate-png

      - name: Give the PDF its public name
        run: cp rendercv_output/Joe_Wiegert_CV.pdf Joe_Wiegert_Resume.pdf

      - name: Save the PDF as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: resume
          path: Joe_Wiegert_Resume.pdf

      - name: Publish a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}"
          gh release create "$tag" Joe_Wiegert_Resume.pdf \
            --title "Resume $tag" \
            --notes "Built from commit $GITHUB_SHA" \
            --latest
